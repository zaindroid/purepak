name: iOS build

# Manual trigger, plus automatically whenever something under ios/ changes.
# Runs on GitHub's macOS runner — free for public repos, no Mac needed on
# anyone's end. Produces a signed .ipa as a downloadable workflow artifact;
# upload it to TestFlight yourself via Transporter (or ask for that step to
# be automated too once this baseline build is working).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # ---- secrets this workflow expects (repo Settings -> Secrets and
      # variables -> Actions -> New repository secret) ----
      #   IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64  <- base64 of ios/PurePak/GoogleService-Info.plist
      #   IOS_DIST_CERT_P12_BASE64              <- contents of ios/certs/distribution.p12.b64
      #   IOS_DIST_CERT_PASSWORD                <- contents of ios/certs/p12_password.txt
      #   IOS_PROVISION_PROFILE_BASE64          <- contents of ios/certs/profile.b64
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/PurePak/GoogleService-Info.plist

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_BASE64" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          rm -f /tmp/dist.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/purepak.mobileprovision

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Resolve Swift packages
        run: cd ios && xcodebuild -resolvePackageDependencies -project PurePak.xcodeproj -scheme PurePak

      - name: Archive
        run: |
          cd ios
          xcodebuild -project PurePak.xcodeproj -scheme PurePak -configuration Release \
            -archivePath build/PurePak.xcarchive -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="PurePak App Store" \
            CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM=88VWT2K3LJ \
            archive

      - name: Export .ipa
        run: |
          cd ios
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>88VWT2K3LJ</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.purepak.app</key>
              <string>PurePak App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/PurePak.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: PurePak-ipa
          path: ios/build/export/*.ipa
          retention-days: 14
