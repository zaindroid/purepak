name: purepak
kind: node
memory_mb: 512
port: 8080
# SQLite (node:sqlite) + receipt images live in this durable mount, created by
# the platform as a named volume so state survives container restarts/redeploys.
persistent_storage:
  mount_path: /var/lib/purepak
# Data dir passed as an env var (value = mount path above; not auto-generatable).
env:
  PUREPAK_DATA_DIR:
    required: true
