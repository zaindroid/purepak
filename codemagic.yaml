workflows:
  purepak-ios-testflight:
    name: PurePak iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # still used for the TestFlight upload step at the bottom (auth:
      # integration, publishing.app_store_connect) — that only needs
      # App Manager-level access, unlike creating certs/profiles, so this
      # integration is kept even though signing itself no longer goes
      # through it (see "Set up code signing" below)
      app_store_connect: PurePak
    environment:
      # GOOGLE_SERVICE_INFO_PLIST_B64, IOS_CERTIFICATE_P12_B64,
      # IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_B64 — all real
      # credentials, never committed to git, saved under the "ios" group on
      # this app's Environment variables tab.
      #
      # The cert/profile pair is a manually-created "Apple Distribution"
      # cert + "PurePak App Store" provisioning profile, not Codemagic's
      # automatic fetch-signing-files flow — that flow kept reusing/creating
      # a profile that Xcode rejected with "requires a provisioning profile
      # with the Push Notifications feature" even after confirming the App
      # ID capability and API key role were both correct. Manual signing
      # sidesteps whatever was going wrong there.
      groups:
        - ios
      vars:
        BUNDLE_ID: "com.purepak.app"
        XCODE_SCHEME: "PurePak"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Write GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/PurePak/GoogleService-Info.plist
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up code signing
        script: |
          echo "$IOS_CERTIFICATE_P12_B64" | base64 --decode > /tmp/distribution.p12
          echo "$IOS_PROVISIONING_PROFILE_B64" | base64 --decode > /tmp/PurePak_App_Store.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/PurePak_App_Store.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          keychain initialize
          keychain add-certificates --certificate /tmp/distribution.p12 --certificate-password "$IOS_CERTIFICATE_PASSWORD"
      - name: Build
        script: |
          cd ios
          xcode-project build-ipa \
            --project "PurePak.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$(pwd)/ExportOptions.plist"
    artifacts:
      # relative to the repo root, not to ios/ — the Build step cd's into
      # ios/ first, so build-ipa's default output actually lands at
      # ios/build/ios/ipa/*.ipa. The un-prefixed path here never matched
      # anything, which is why publishing silently skipped with "no IPAs
      # or PKGs found" even on an otherwise fully successful build.
      - ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # flip on once you're ready to send a build to review instead of
        # just TestFlight testers
        submit_to_app_store: false
